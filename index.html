<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content='width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <title>Unity WebGL Player | WebAR Watanoge</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html { height: -webkit-fill-available; }
        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden;
        }
        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            background: #fffa;
            z-index: 99;
        }
        .action-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            width: 90%;
            max-width: 380px;
            justify-content: center;
        }
        .action-btn {
            padding: 12px 20px;
            font-size: 15px;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            font-weight: bold;
            white-space: nowrap;
            flex: 1;
            max-width: 170px;
        }
        @media (max-width: 360px) {
            .action-btn { padding: 10px 16px; font-size: 14px; }
            .action-buttons { bottom: 15px; gap: 8px; }
        }
    </style>
</head>
<body>
    <!--IMAGETARGETS-->
		<imagetarget id='LaoBi' src='targets/Screenshot 2026-03-17 114658.png'></imagetarget>
		<imagetarget id='bfly' src='targets/bfly.png'></imagetarget>
		<imagetarget id='lady' src='targets/lady.png'></imagetarget>
		<imagetarget id='bear' src='targets/bear.png'></imagetarget>
		<imagetarget id='reel' src='targets/reel.png'></imagetarget>
		<imagetarget id='rmn' src='targets/rmn.png'></imagetarget>
		<imagetarget id='flower' src='targets/flower.png'></imagetarget>
		<imagetarget id='WhiteClaw' src='targets/Hierarchy Designer Promotional Editor Favorites.png'></imagetarget>
		<imagetarget id='Pattern-hiro' src='targets/Pattern-hiro.png'></imagetarget>

    <video id="webcam-video" muted autoplay playsinline style="width:1px;position:absolute"></video>
    <canvas id="video-canvas" style="width:100%; height:100%; object-fit:cover; position:absolute"></canvas>
    <div id="startARDiv" class="ctaDiv">
        <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select>
        <p style="text-align: center; width:60vw;">This augmented reality experience requires access to your device's camera</p>
        <button id="startARButton" onclick="StartAR()" style="display:none">ALLOW ACCESS</button>
    </div>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">...</div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">...</div>
    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">...</div>
    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas" style="width: 100%; height: 100%; background: #0000; z-index: -99"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>
    <!-- BOTONES DE ACCIÓN -->
    <div class="action-buttons">
        <button id="photoButton" onclick="TakePhoto()" class="action-btn" 
                style="background:rgba(0,0,0,0.85); display:none;">
            📸 Foto
        </button>
        <button id="videoButton" onclick="ToggleVideoRecording()" class="action-btn" 
                style="background:rgba(220,0,0,0.9); display:none;">
            🎥 Grabar Video
        </button>
    </div>
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <script src="Build/Build.loader.js"></script>
    <script>
        // ==================== GLOBALES ====================
        window.unityInstance = null;
        window.unityInstanceReady = false;
        window.webcamStream = null;
        window.requestingForPermissions = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        // ==================== INITIALIZE ====================
        var initialize = async () => {
            var unityCanvas = document.querySelector("#unity-canvas");
            var videoCanvas = document.querySelector("#video-canvas");
            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.iTracker = new ImageTracker(arCamera);
            try {
                await window.iTracker.initialize();
                console.log("✅ ImageTracker initialized successfully");
            } catch (error) {
                console.error("Failed to initialize ImageTracker:", error);
                ShowError("Failed to initialize the experience.");
                return;
            }
            await LoadWebcams();
            document.getElementById("startARButton").style.display = "block";
        };
        initialize();
        // ==================== START AR ====================
        function StartAR() {
            const canvas = document.querySelector("#unity-canvas");
            document.getElementById("startARDiv").style.display = "none";
            createUnityInstance(canvas, {
                dataUrl: "Build/Build.data.unityweb",
                frameworkUrl: "Build/Build.framework.js.unityweb",
                codeUrl: "Build/Build.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Apolograma",
                productName: "WebAR Watanoge",
                productVersion: "0.1.0",
            }, (progress) => {
                document.getElementById("unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                window.unityInstanceReady = true;
                console.log("✅ Unity WebGL fully ready");
                RequestWebcam();
                ShowActionButtons();
                document.getElementById("unity-loading-bar").style.display = "none";
            }).catch(err => {
                console.error("Unity failed to load:", err);
                ShowError("Failed to load Unity. Please refresh the page.");
            });
            document.getElementById("unity-loading-bar").style.display = "block";
        }
        // ==================== WEBCAM ====================
		window.unityFacingMode = "environment"
        window.WEBCAM_SETTINGS = {
            video: { facingMode: window.unityFacingMode },
            audio: false
        };
        async function RequestWebcam(){
            window.requestingForPermissions = true;
            try{
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                console.log("Webcam access granted");
            } catch (err) {
                console.error("getUserMedia error - ", err);
                ShowError("Failed to start the experience. Camera permission was denied");
            } finally {
                window.requestingForPermissions = false;
            }
        }
        async function StartWebcam() {
            console.log("=== StartWebcam called ===");
            while (window.requestingForPermissions) {
                await new Promise(r => setTimeout(r, 100));
            }
            let attempts = 0;
            while ((!window.unityInstance || !window.unityInstanceReady) && attempts < 120) {
                await new Promise(r => setTimeout(r, 150));
                attempts++;
            }
            try {
                if (!window.webcamStream || window.webcamStream.getVideoTracks()[0]?.readyState === "ended") {
                    window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                }
                const video = document.querySelector("#webcam-video");
                video.srcObject = window.webcamStream;
                await new Promise(resolve => {
                    video.onloadedmetadata = () => setTimeout(resolve, 300);
                    setTimeout(resolve, 1800);
                });
                await new Promise(r => requestAnimationFrame(r));
                await new Promise(r => setTimeout(r, 150));
                await window.arCamera.startWebcam(video);
                console.log("✅ Webcam started successfully");
                window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
            } catch (err) {
                console.error("❌ Webcam failed to start:", err);
                if (window.unityInstance) window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
            }
        }
        // ==================== FOTO ====================
        async function TakePhoto() {
            const unityCanvas = document.querySelector("#unity-canvas");
            if (!unityCanvas) return;
            try {
                const dataUrl = unityCanvas.toDataURL('image/jpeg', 0.95);
                const blob = await fetch(dataUrl).then(r => r.blob());
                const file = new File([blob], `watanoge-photo-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.jpg`, { type: "image/jpeg" });
                if (navigator.share && navigator.canShare({files: [file]})) {
                    await navigator.share({ files: [file], title: 'Foto AR Watanoge' });
                } else {
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = file.name;
                    a.click();
                }
                showNotification("✅ Foto guardada");
            } catch (err) {
                console.error(err);
                showNotification("❌ Error al tomar la foto", "error");
            }
        }
        // ==================== VIDEO (Captura Unity con captureStream) ====================
        function ToggleVideoRecording() {
            const btn = document.getElementById("videoButton");
            const unityCanvas = document.querySelector("#unity-canvas");
            if (!isRecording) {
                if (!unityCanvas) {
                    showNotification("❌ Canvas no disponible", "error");
                    return;
                }
                recordedChunks = [];
                try {
                    // Capturamos el stream directamente del canvas de Unity (incluye AR)
                    const canvasStream = unityCanvas.captureStream(30); // 30 FPS
                    mediaRecorder = new MediaRecorder(canvasStream, { 
                        mimeType: MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm'
                    });
                    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType });
                        const extension = mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
                        const filename = `watanoge-video-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.${extension}`;
                        const file = new File([blob], filename, { type: mediaRecorder.mimeType });
                        try {
                            if (navigator.share && navigator.canShare({files: [file]})) {
                                await navigator.share({ files: [file], title: 'Video AR Watanoge' });
                            } else {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = filename;
                                a.click();
                                URL.revokeObjectURL(url);
                            }
                            showNotification("✅ Video guardado");
                        } catch (err) {
                            console.error(err);
                            showNotification("❌ Error al guardar video", "error");
                        }
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.textContent = "⏹️ Detener";
                    btn.style.background = "rgba(200,0,0,0.95)";
                    showNotification("🎥 Grabando AR...");
                } catch (err) {
                    console.error(err);
                    showNotification("❌ Error al iniciar grabación", "error");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.textContent = "🎥 Grabar Video";
                btn.style.background = "rgba(220,0,0,0.9)";
            }
        }
        function showNotification(message, type = "success") {
            let notif = document.getElementById("screenshotNotification");
            if (!notif) {
                notif = document.createElement("div");
                notif.id = "screenshotNotification";
                notif.style.cssText = `position:fixed; top:20px; left:50%; transform:translateX(-50%);
                    padding:14px 24px; border-radius:12px; color:white; font-weight:bold;
                    z-index:200; box-shadow:0 6px 20px rgba(0,0,0,0.4);`;
                document.body.appendChild(notif);
            }
            notif.style.background = type === "success" ? "#00c853" : "#f44336";
            notif.textContent = message;
            notif.style.display = "block";
            setTimeout(() => {
                notif.style.opacity = "0";
                setTimeout(() => { notif.style.display = "none"; notif.style.opacity = "1"; }, 600);
            }, 2200);
        }
        function ShowActionButtons() {
            document.getElementById("photoButton").style.display = "block";
            document.getElementById("videoButton").style.display = "block";
        }
        // ==================== FUNCIONES ORIGINALES ====================
        async function LoadWebcams(){
            let camDevices = [];
            let devices = await navigator.mediaDevices.enumerateDevices();
            var ctr = 0;
            devices.forEach(mediaDevice => {
                if (mediaDevice.kind === 'videoinput') {
                    if(window.unityFacingMode == 'environment' && !mediaDevice.label.includes('facing front')){
                        camDevices.push(mediaDevice);
                    }
                    else if(window.unityFacingMode == 'user' && mediaDevice.label.includes('facing front')){
                        camDevices.push(mediaDevice);
                    }
                    else{
                        camDevices.push(mediaDevice);
                    }   
                    ctr++;
                }
            });
            var select = document.getElementById("chooseCamSel");
            select.style.display = "block";
            var count = 0;
            camDevices = camDevices.reverse();
            camDevices.forEach(mediaDevice => {
                const option = document.createElement('option');
                option.value = mediaDevice.deviceId;
                let label = `Camera ${count}`;
                if (mediaDevice.label) label = mediaDevice.label;
                const textNode = document.createTextNode(label);
                option.appendChild(textNode);
                select.appendChild(option);
                count++;
            });
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        function SelectCam(){
            var select = document.getElementById("chooseCamSel");
            window.deviceId = select.value;
            window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        async function FlipCam(){
            arCamera.stopWebcam();
            window.WEBCAM_SETTINGS.video.deviceId = '';
            if(window.WEBCAM_SETTINGS.video.facingMode == 'user'){
                window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                arCamera.setFlipped(false);
            }
            else{
                window.WEBCAM_SETTINGS.video.facingMode = 'user';
                arCamera.setFlipped(true);
            }
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
            const video = document.querySelector("#webcam-video");
            video.srcObject = webcamStream;
            await arCamera.startWebcam(video);
        }
        function ShowError(error){
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").innerHTML = error;
        }
        function ShowScreenshot(dataUrl){
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80vw";
            document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "vw";
        }
        function ShowConfirmUrl(url){
            document.getElementById("confirmUrlDiv").style.display = "flex";
            window.newUrlString = url;
            document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;                
        }
        window.ITRACKER_GLOBALS = {
            INTERNAL_SMOOTHFACTOR_POS: .075,
        };
    </script>
</body>
</html>
