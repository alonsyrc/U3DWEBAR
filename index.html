<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content='width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=yes'>
    <title>Unity WebGL Player | WebAR Watanoge</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html {
            height: -webkit-fill-available;
        }
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            width: 100vw;
            overflow: hidden;
        }
        .ctaDiv {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: #fffa;
            z-index: 99;
        }
        .action-buttons {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 100;
            width: 90%;
            max-width: 380px;
            justify-content: center;
        }
        .action-btn {
            padding: 12px 20px;
            font-size: 15px;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            font-weight: bold;
            white-space: nowrap;
            flex: 1;
            max-width: 170px;
        }
        @media (max-width: 360px) {
            .action-btn {
                padding: 10px 16px;
                font-size: 14px;
            }
            .action-buttons {
                bottom: 15px;
                gap: 8px;
            }
        }
        /* Used during video recording to hide unity-canvas.
           Must use !important because Unity WebGL overrides inline styles. */
        #unity-canvas.recording-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
    <script>
        // === FORCE TRANSPARENT WEBGL CONTEXT FOR UNITY CANVAS ===
        // Must run BEFORE Unity's Build.loader.js creates the WebGL context.
        // This makes the Unity canvas background transparent so the camera feed
        // behind it is visible.
        (function () {
            var _origGetContext = HTMLCanvasElement.prototype.getContext;
            HTMLCanvasElement.prototype.getContext = function (type, attrs) {
                if (this.id === 'unity-canvas' && (type === 'webgl' || type === 'webgl2')) {
                    attrs = Object.assign({}, attrs || {});
                    attrs.alpha = true;
                    attrs.premultipliedAlpha = false;
                    attrs.preserveDrawingBuffer = true;
                    console.log('🔧 Forced transparent WebGL context for unity-canvas');
                }
                return _origGetContext.call(this, type, attrs);
            };
        })();
    </script>
</head>
<body>

    <video id="webcam-video" muted autoplay playsinline style="width:1px;position:absolute"></video>
    <canvas id="video-canvas"
        style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:0"></canvas>
    <div id="startARDiv" class="ctaDiv">
        <select id="chooseCamSel" style="display: none;" onchange="SelectCam()"></select>
        <p style="text-align: center; width:60vw;">This augmented reality experience requires access to your device's
            camera</p>
        <button id="startARButton" onclick="StartAR()" style="display:none">ALLOW ACCESS</button>
    </div>
    <div id="screenshotDiv" style="display: none;" class="ctaDiv">...</div>
    <div id="confirmUrlDiv" style="display: none;" class="ctaDiv">...</div>
    <div id="errorDiv" class="ctaDiv" style="display: none; background:#aaa">...</div>
    <div id="unity-container" class="unity-mobile">
        <canvas id="unity-canvas"
            style="width: 100%; height: 100%; background: transparent; position: absolute; top: 0; left: 0; z-index: 1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
    </div>
    <!-- BOTONES -->
    <div class="action-buttons">
        <button id="photoButton" onclick="TakePhoto()" class="action-btn"
            style="background:rgba(0,0,0,0.85); display:none;">
            📸 Foto
        </button>
        <button id="videoButton" onclick="ToggleVideoRecording()" class="action-btn"
            style="background:rgba(220,0,0,0.9); display:none;">
            🎥 Grabar Video
        </button>
    </div>
    <script src="arcamera.js" type="text/javascript"></script>
    <script src="itracker.js" type="text/javascript"></script>
    <script src="Build/Build.loader.js"></script>
    <script>
        // ==================== GLOBALES ====================
        window.unityInstance = null;
        window.unityInstanceReady = false;
        window.webcamStream = null;
        window.requestingForPermissions = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        // ==================== INITIALIZE ====================
        var initialize = async () => {
            var unityCanvas = document.querySelector("#unity-canvas");
            var videoCanvas = document.querySelector("#video-canvas");
            window.arCamera = new ARCamera(unityCanvas, videoCanvas);
            window.iTracker = new ImageTracker(arCamera);
            try {
                await window.iTracker.initialize();
                console.log("✅ ImageTracker initialized successfully");
            } catch (error) {
                console.error("Failed to initialize ImageTracker:", error);
                ShowError("Failed to initialize the experience.");
                return;
            }
            await LoadWebcams();
            document.getElementById("startARButton").style.display = "block";
        };
        initialize();
        function StartAR() {
            const canvas = document.querySelector("#unity-canvas");
            document.getElementById("startARDiv").style.display = "none";
            createUnityInstance(canvas, {
                dataUrl: "Build/Build.data.unityweb",
                frameworkUrl: "Build/Build.framework.js.unityweb",
                codeUrl: "Build/Build.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Apolograma",
                productName: "WebAR Watanoge",
                productVersion: "0.1.0",
            }, (progress) => {
                document.getElementById("unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                window.unityInstance = unityInstance;
                window.unityInstanceReady = true;
                console.log("✅ Unity WebGL fully ready");
                RequestWebcam();
                ShowActionButtons();
                document.getElementById("unity-loading-bar").style.display = "none";
            }).catch(err => {
                console.error("Unity failed to load:", err);
                ShowError("Failed to load Unity. Please refresh the page.");
            });
            document.getElementById("unity-loading-bar").style.display = "block";
        }
        // ==================== WEBCAM ====================
		window.unityFacingMode = "environment"
        window.WEBCAM_SETTINGS = {
            video: { facingMode: window.unityFacingMode },
            audio: false
        };
        async function RequestWebcam() {
            window.requestingForPermissions = true;
            try {
                window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                console.log("Webcam access granted");
            } catch (err) {
                console.error("getUserMedia error - ", err);
                ShowError("Failed to start the experience. Camera permission was denied");
            } finally {
                window.requestingForPermissions = false;
            }
        }
        async function StartWebcam() {
            console.log("=== StartWebcam called ===");
            while (window.requestingForPermissions) await new Promise(r => setTimeout(r, 100));
            let attempts = 0;
            while ((!window.unityInstance || !window.unityInstanceReady) && attempts < 120) {
                await new Promise(r => setTimeout(r, 150));
                attempts++;
            }
            try {
                if (!window.webcamStream || window.webcamStream.getVideoTracks()[0]?.readyState === "ended") {
                    window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
                }
                const video = document.querySelector("#webcam-video");
                video.srcObject = window.webcamStream;
                await new Promise(resolve => {
                    video.onloadedmetadata = () => setTimeout(resolve, 300);
                    setTimeout(resolve, 1800);
                });
                await new Promise(r => requestAnimationFrame(r));
                await new Promise(r => setTimeout(r, 150));
                await window.arCamera.startWebcam(video);
                console.log("✅ Webcam started successfully");
                window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamSuccess');
            } catch (err) {
                console.error("❌ Webcam failed to start:", err);
                if (window.unityInstance) window.unityInstance.SendMessage('ARCamera', 'OnStartWebcamFail');
            }
        }
        // ==================== DETECCIÓN DE PLATAFORMA ====================
        const isAndroid = /android/i.test(navigator.userAgent);
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        // Helper: descargar archivo directamente
        function downloadFile(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
        // Helper: guardar archivo (descarga en Android, share en iOS)
        async function saveFile(blob, filename, title) {
            const file = new File([blob], filename, { type: blob.type });
            // Android: descargar directo (va a Descargas → visible en Galería)
            if (isAndroid) {
                downloadFile(blob, filename);
                showNotification("✅ Guardado en Descargas");
                return;
            }
            // iOS/otros: usar share (muestra "Guardar imagen/video")
            try {
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: title });
                    showNotification("✅ Guardado");
                } else {
                    downloadFile(blob, filename);
                    showNotification("✅ Guardado en Descargas");
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    showNotification("↩️ Cancelado");
                } else {
                    console.warn('Share failed, downloading instead:', err);
                    downloadFile(blob, filename);
                    showNotification("✅ Guardado en Descargas");
                }
            }
        }
        // ==================== FOTO - CÁMARA + UNITY ====================
        async function TakePhoto() {
            const unityCanvas = document.querySelector("#unity-canvas");
            const videoCanvas = document.querySelector("#video-canvas");
            if (!unityCanvas) return;
            try {
                const tempCanvas = document.createElement("canvas");
                const ctx = tempCanvas.getContext("2d");
                tempCanvas.width = unityCanvas.width;
                tempCanvas.height = unityCanvas.height;
                // 1. Fondo: Feed de la cámara
                if (videoCanvas && videoCanvas.width > 0) {
                    ctx.drawImage(videoCanvas, 0, 0, tempCanvas.width, tempCanvas.height);
                }
                // 2. Encima: Unity AR (solo si NO estamos grabando,
                //    porque durante grabación video-canvas ya tiene Unity integrado)
                if (!isOverlaying) {
                    ctx.drawImage(unityCanvas, 0, 0, tempCanvas.width, tempCanvas.height);
                }
                const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.95);
                const blob = await fetch(dataUrl).then(r => r.blob());
                const filename = `watanoge-photo-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.jpg`;
                await saveFile(blob, filename, 'Foto AR Watanoge');
            } catch (err) {
                console.error(err);
                showNotification("❌ Error al tomar la foto", "error");
            }
        }
        // ==================== VIDEO (Cámara + Unity combinados) ====================
        let isOverlaying = false;
        const _nativeDrawImage = CanvasRenderingContext2D.prototype.drawImage;
        function startRecordingOverlay(vCtx, unityCanvas, videoCanvas) {
            isOverlaying = true;
            // Monkey-patch drawImage on the video-canvas context.
            // When arcamera draws the camera feed (HTMLVideoElement source),
            // we immediately draw Unity AR content on top in the same paint.
            // This eliminates flickering caused by timing gaps between separate loops.
            vCtx.drawImage = function (...args) {
                _nativeDrawImage.apply(this, args);
                // After camera feed is drawn, inject Unity AR overlay
                if (isOverlaying && args[0] instanceof HTMLVideoElement) {
                    this.save();
                    this.setTransform(1, 0, 0, 1, 0, 0); // reset transform
                    _nativeDrawImage.call(this, unityCanvas, 0, 0, videoCanvas.width, videoCanvas.height);
                    this.restore();
                }
            };
            // Hide unity-canvas to prevent visual duplication.
            // Use CSS class with !important — Unity WebGL overrides inline styles.
            unityCanvas.classList.add('recording-hidden');
            console.log('📹 Unity canvas hidden for recording');
        }
        function stopRecordingOverlay(unityCanvas) {
            isOverlaying = false;
            // Remove the drawImage patch (restores native prototype method)
            const videoCanvas = document.querySelector("#video-canvas");
            if (videoCanvas) {
                const vCtx = videoCanvas.getContext('2d');
                delete vCtx.drawImage;
            }
            // Show unity-canvas again
            if (unityCanvas) {
                unityCanvas.classList.remove('recording-hidden');
                console.log('📹 Unity canvas visible again');
            }
        }
        function ToggleVideoRecording() {
            const btn = document.getElementById("videoButton");
            const unityCanvas = document.querySelector("#unity-canvas");
            const videoCanvas = document.querySelector("#video-canvas");
            if (!isRecording) {
                if (!unityCanvas || !videoCanvas) {
                    showNotification("❌ Canvas no disponible", "error");
                    return;
                }
                recordedChunks = [];
                try {
                    const vCtx = videoCanvas.getContext('2d');
                    // Start the drawImage overlay patch
                    startRecordingOverlay(vCtx, unityCanvas, videoCanvas);
                    // Capture stream from the existing visible video-canvas
                    let stream = null;
                    try {
                        stream = videoCanvas.captureStream(30);
                        console.log('📹 Using video-canvas captureStream');
                    } catch (e1) {
                        console.warn('📹 captureStream failed, trying webcam stream');
                        if (window.webcamStream) {
                            stream = window.webcamStream;
                        }
                    }
                    if (!stream || stream.getTracks().length === 0) {
                        showNotification("❌ No se pudo acceder al video", "error");
                        stopRecordingOverlay(unityCanvas);
                        return;
                    }
                    // Pick the best supported MIME type
                    const mimeTypes = [
                        'video/mp4',
                        'video/webm;codecs=h264',
                        'video/webm;codecs=vp9',
                        'video/webm;codecs=vp8',
                        'video/webm'
                    ];
                    let selectedMime = 'video/webm';
                    for (const mime of mimeTypes) {
                        if (MediaRecorder.isTypeSupported(mime)) {
                            selectedMime = mime;
                            break;
                        }
                    }
                    console.log('📹 Recording with MIME:', selectedMime);
                    mediaRecorder = new MediaRecorder(stream, { mimeType: selectedMime });
                    mediaRecorder.ondataavailable = e => {
                        if (e.data) recordedChunks.push(e.data);
                    };
                    mediaRecorder.onerror = (e) => {
                        console.error('📹 MediaRecorder error:', e);
                        showNotification("❌ Error en grabación", "error");
                        stopRecordingOverlay(unityCanvas);
                        isRecording = false;
                        btn.textContent = "🎥 Grabar Video";
                        btn.style.background = "rgba(220,0,0,0.9)";
                    };
                    mediaRecorder.onstop = async () => {
                        stopRecordingOverlay(unityCanvas);
                        const validChunks = recordedChunks.filter(c => c.size > 0);
                        if (validChunks.length === 0) {
                            showNotification("⚠️ Intentando método alternativo...");
                            tryFallbackRecording(btn, selectedMime);
                            return;
                        }
                        const blob = new Blob(validChunks, { type: selectedMime });
                        if (blob.size === 0) {
                            showNotification("⚠️ Intentando método alternativo...");
                            tryFallbackRecording(btn, selectedMime);
                            return;
                        }
                        await saveVideoBlob(blob, selectedMime);
                    };
                    mediaRecorder.start(500);
                    isRecording = true;
                    btn.textContent = "⏹️ Detener";
                    btn.style.background = "rgba(200,0,0,0.95)";
                    showNotification("🎥 Grabando...");
                } catch (err) {
                    console.error('📹 Failed to start recording:', err);
                    stopRecordingOverlay(unityCanvas);
                    showNotification("❌ Error al iniciar grabación", "error");
                }
            } else {
                stopRecordingOverlay(unityCanvas);
                mediaRecorder.stop();
                isRecording = false;
                btn.textContent = "🎥 Grabar Video";
                btn.style.background = "rgba(220,0,0,0.9)";
            }
        }
        // Fallback: record directly from webcam stream (no AR overlay)
        function tryFallbackRecording(btn, preferredMime) {
            if (!window.webcamStream) {
                showNotification("❌ No se pudo grabar video", "error");
                return;
            }
            showNotification("🎥 Grabando (sin AR)...");
            const fallbackChunks = [];
            const fbRecorder = new MediaRecorder(window.webcamStream, { mimeType: preferredMime });
            fbRecorder.ondataavailable = e => { if (e.data) fallbackChunks.push(e.data); };
            fbRecorder.onstop = async () => {
                const blob = new Blob(fallbackChunks, { type: preferredMime });
                if (blob.size > 0) {
                    await saveVideoBlob(blob, preferredMime);
                } else {
                    showNotification("❌ No se pudo grabar video", "error");
                }
            };
            fbRecorder.start(500);
            // Record 5 seconds as fallback demo
            setTimeout(() => {
                fbRecorder.stop();
                btn.textContent = "🎥 Grabar Video";
                btn.style.background = "rgba(220,0,0,0.9)";
            }, 5000);
        }
        // Shared save logic for video blobs
        async function saveVideoBlob(blob, mimeType) {
            const baseMime = mimeType.split(';')[0];
            const extension = baseMime.includes('mp4') ? 'mp4' : 'webm';
            const filename = `watanoge-video-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.${extension}`;
            const videoBlob = new Blob([blob], { type: baseMime });
            await saveFile(videoBlob, filename, 'Video AR Watanoge');
        }
        function showNotification(message, type = "success") {
            let notif = document.getElementById("screenshotNotification");
            if (!notif) {
                notif = document.createElement("div");
                notif.id = "screenshotNotification";
                notif.style.cssText = `position:fixed; top:20px; left:50%; transform:translateX(-50%);
                    padding:14px 24px; border-radius:12px; color:white; font-weight:bold;
                    z-index:200; box-shadow:0 6px 20px rgba(0,0,0,0.4);`;
                document.body.appendChild(notif);
            }
            notif.style.background = type === "success" ? "#00c853" : "#f44336";
            notif.textContent = message;
            notif.style.display = "block";
            setTimeout(() => {
                notif.style.opacity = "0";
                setTimeout(() => { notif.style.display = "none"; notif.style.opacity = "1"; }, 600);
            }, 2200);
        }
        function ShowActionButtons() {
            document.getElementById("photoButton").style.display = "block";
            document.getElementById("videoButton").style.display = "block";
        }
        // ==================== FUNCIONES ORIGINALES ====================
        async function LoadWebcams() {
            let camDevices = [];
            let devices = await navigator.mediaDevices.enumerateDevices();
            var ctr = 0;
            devices.forEach(mediaDevice => {
                if (mediaDevice.kind === 'videoinput') {
                    if (window.unityFacingMode == 'environment' && !mediaDevice.label.includes('facing front')) {
                        camDevices.push(mediaDevice);
                    }
                    else if (window.unityFacingMode == 'user' && mediaDevice.label.includes('facing front')) {
                        camDevices.push(mediaDevice);
                    }
                    else {
                        camDevices.push(mediaDevice);
                    }
                    ctr++;
                }
            });
            var select = document.getElementById("chooseCamSel");
            select.style.display = "block";
            var count = 0;
            camDevices = camDevices.reverse();
            camDevices.forEach(mediaDevice => {
                const option = document.createElement('option');
                option.value = mediaDevice.deviceId;
                let label = `Camera ${count}`;
                if (mediaDevice.label) label = mediaDevice.label;
                const textNode = document.createTextNode(label);
                option.appendChild(textNode);
                select.appendChild(option);
                count++;
            });
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        function SelectCam() {
            var select = document.getElementById("chooseCamSel");
            window.deviceId = select.value;
            window.WEBCAM_SETTINGS.video['deviceId'] = deviceId;
            iTracker.WEBCAM_NAME = select.options[select.selectedIndex].innerHTML;
        }
        async function FlipCam() {
            arCamera.stopWebcam();
            window.WEBCAM_SETTINGS.video.deviceId = '';
            if (window.WEBCAM_SETTINGS.video.facingMode == 'user') {
                window.WEBCAM_SETTINGS.video.facingMode = 'environment';
                arCamera.setFlipped(false);
            }
            else {
                window.WEBCAM_SETTINGS.video.facingMode = 'user';
                arCamera.setFlipped(true);
            }
            window.webcamStream = await navigator.mediaDevices.getUserMedia(window.WEBCAM_SETTINGS);
            const video = document.querySelector("#webcam-video");
            video.srcObject = webcamStream;
            await arCamera.startWebcam(video);
        }
        function ShowError(error) {
            document.getElementById("errorDiv").style.display = "flex";
            document.getElementById("errorText").innerHTML = error;
        }
        function ShowScreenshot(dataUrl) {
            document.getElementById("screenshotDiv").style.display = "flex";
            document.getElementById("screenshotImg").src = dataUrl;
            document.getElementById("screenshotImg").style.width = "80vw";
            document.getElementById("screenshotImg").style.height = 80 / window.innerWidth * window.innerHeight + "vw";
        }
        function ShowConfirmUrl(url) {
            document.getElementById("confirmUrlDiv").style.display = "flex";
            window.newUrlString = url;
            document.getElementById("confirmUrlText").innerText = "Are you sure you want to visit " + url;
        }
        window.ITRACKER_GLOBALS = {
            INTERNAL_SMOOTHFACTOR_POS: .075,
        };
    </script>
</body>
